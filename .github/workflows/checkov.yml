name: Terraform Security Scan

on:
  push:
    branches:
      - main

  pull_request:

jobs:
  checkov-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov Scan
        run: checkov -d .
